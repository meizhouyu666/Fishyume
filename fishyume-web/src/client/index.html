<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Fishyume 团队控制台</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">F</span><span>Fishyume</span></div>
        <nav class="view-switch" aria-label="工作区视图">
          <button class="view-tab is-active" data-view="teams"><i data-lucide="messages-square"></i><span>团队</span></button>
          <button class="view-tab" data-view="runs"><i data-lucide="workflow"></i><span>运行</span></button>
          <button class="view-tab" data-view="routing"><i data-lucide="route"></i><span>路由</span></button>
        </nav>
        <div class="connection-state"><span class="signal"></span><span id="connection-label">连接中</span></div>
      </header>
      <main class="workspace">
        <aside class="collection-pane" aria-label="项目列表">
          <div class="pane-heading">
            <div><span class="eyebrow" id="collection-eyebrow">探索</span><h1 id="collection-title">团队</h1></div>
            <button class="icon-button" id="refresh-button" title="刷新"><i data-lucide="refresh-cw"></i></button>
          </div>
          <div class="filter-row" id="filter-row">
            <button class="filter is-active" data-filter="all">全部</button>
            <button class="filter" data-filter="active">进行中</button>
            <button class="filter" data-filter="closed">已关闭</button>
          </div>
          <div id="collection-list" class="collection-list" aria-live="polite"></div>
        </aside>
        <section id="detail-pane" class="detail-pane" aria-live="polite"></section>
      </main>
      <div id="toast-region" class="toast-region" aria-live="assertive"></div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
