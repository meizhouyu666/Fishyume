apiVersion: fishyume/v1
name: fishyume-live-smoke
defaults:
  tool: codex
  runtime: local
execution:
  maxConcurrency: 2
nodes:
  plan:
    type: agent
    task: "Return exactly: smoke plan completed."
  review:
    type: agent
    task: "Return exactly: smoke review completed."
  approve:
    type: approval
    dependsOn: [plan, review]
    prompt: "Approve the smoke plan?"
  implement:
    type: agent
    dependsOn: [approve]
    when:
      node: approve
      field: result.decision
      equals: approved
    task: "Return exactly: smoke implementation completed after {{ nodes.plan.result.summary }} and {{ nodes.review.result.summary }}"
    requiredSkills: []
