name: Fishyume CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: wf/package-lock.json
      - name: Go tests (Driver and historical compatibility fixtures included)
        working-directory: wf-engine
        shell: bash
        run: |
          set -euo pipefail
          if ! go test -json ./... -count=1 -timeout 10m; then
            echo 'Initial Go test run failed; retrying once with a fresh process state.' >&2
            go test -json ./... -count=1 -timeout 10m
          fi
      - name: Go vet
        run: node wf/scripts/preflight.mjs --step go-vet
      - name: Go build
        run: node wf/scripts/preflight.mjs --step go-build
      - name: Linux race check
        if: runner.os == 'Linux'
        working-directory: wf-engine
        shell: bash
        run: |
          set -euo pipefail
          if ! go test -race ./... -count=1 -timeout 15m; then
            echo 'Initial Linux race run failed; retrying once with a fresh process state.' >&2
            go test -race ./... -count=1 -timeout 15m
          fi
      - name: TypeScript checks
        run: |
          npm --prefix wf ci
          node wf/scripts/preflight.mjs --step typescript
      - name: Diff check
        run: node wf/scripts/preflight.mjs --step diff-check
      - name: Reliability script tests
        run: node --test wf/scripts/reliability-scripts.test.mjs

  stress:
    name: Deterministic high-risk stress gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - name: Stress internal lifecycle packages (20 repetitions)
        run: node wf/scripts/stress.mjs

  artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - name: Build Windows and Linux Engine artifacts
        shell: pwsh
        run: |
          ./wf/scripts/build-engine-artifacts.ps1 -Target windows-amd64
          ./wf/scripts/build-engine-artifacts.ps1 -Target linux-amd64
      - name: Verify checksums
        shell: pwsh
        run: |
          ./wf/scripts/verify-engine-artifacts.ps1
          Get-ChildItem ./wf/artifacts -Recurse -Filter SHA256SUMS | ForEach-Object {
            if (-not (Get-Content -Raw $_.FullName).Trim()) { throw "empty checksum file: $($_.FullName)" }
          }

  linux-platform-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: wf/package-lock.json
      - name: Build CLI and Linux Engine
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix wf ci --ignore-scripts
          npm --prefix wf run build
          mkdir -p wf/packages/fishyume-engine-linux-x64/bin "$RUNNER_TEMP/fishyume-packs"
          (cd wf-engine && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../wf/packages/fishyume-engine-linux-x64/bin/fishyume-engine ./cmd/wf-engine)
          chmod 0644 wf/packages/fishyume-engine-linux-x64/bin/fishyume-engine
          (cd wf && npm pack --pack-destination "$RUNNER_TEMP/fishyume-packs")
          (cd wf/packages/fishyume-engine-linux-x64 && npm pack --pack-destination "$RUNNER_TEMP/fishyume-packs")
      - name: Install and verify Linux packages
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/fishyume-install"
          engine_tgz="$RUNNER_TEMP/fishyume-packs/fishyume-engine-linux-x64-0.2.1-alpha.1.tgz"
          npm install --prefix "$install_root" \
            "$RUNNER_TEMP/fishyume-packs/fishyume-0.2.1-alpha.1.tgz" \
            "$engine_tgz" --ignore-scripts
          engine="$install_root/node_modules/fishyume-engine-linux-x64/bin/fishyume-engine"
          test -x "$engine"
          mode="$(stat -c '%a' "$engine")"
          [[ "$mode" =~ ^7[0-7][0-7]$ ]]
          tar -tvf "$engine_tgz" > "$RUNNER_TEMP/fishyume-engine-files.txt"
          grep -Eq '^-rwxr-xr-x .*package/bin/fishyume-engine$' "$RUNNER_TEMP/fishyume-engine-files.txt"
          set +e
          doctor_output="$("$install_root/node_modules/.bin/fishyume" doctor 2>&1)"
          set -e
          echo "$doctor_output"
          grep -q 'ok engine 0.2.1-alpha.1 started' <<<"$doctor_output"
          grep -q 'ok protocol 2 compatible' <<<"$doctor_output"
          help_output="$("$install_root/node_modules/.bin/fishyume" --help)"
          grep -q 'dashboard' <<<"$help_output"
          dashboard_help="$("$install_root/node_modules/.bin/fishyume" dashboard --help)"
          grep -q 'Operator Dashboard' <<<"$dashboard_help"
          setup_output="$("$install_root/node_modules/.bin/fishyume" setup --print)"
          grep -q '^codex mcp add fishyume -- ".*node" ".*/fishyume/dist/cli.js" "mcp"$' <<<"$setup_output"
          demo_output="$("$install_root/node_modules/.bin/fishyume" demo --width 80 --ascii)"
          grep -q '阶段 2 · 并行 2' <<<"$demo_output"
          grep -q '依赖 plan' <<<"$demo_output"
          grep -q '需要人工审批' <<<"$demo_output"
          dashboard_output="$("$install_root/node_modules/.bin/fishyume")"
          grep -q '目前没有可显示的任务。' <<<"$dashboard_output"
          grep -q '检查运行环境：fishyume doctor' <<<"$dashboard_output"

  windows-platform-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: wf/package-lock.json
      - name: Install and verify Windows Developer Preview
        shell: pwsh
        run: |
          $installRoot = "$env:RUNNER_TEMP/fishyume-install"
          ./install-fishyume.ps1 -Prefix $installRoot
          $engine = Join-Path $installRoot 'node_modules/fishyume-engine-win32-x64/bin/fishyume-engine.exe'
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) { throw "missing Windows Engine: $engine" }
          $doctorOutput = & (Join-Path $installRoot 'node_modules/.bin/fishyume.cmd') doctor 2>&1 | Out-String
          $global:LASTEXITCODE = 0
          Write-Output $doctorOutput
          if ($doctorOutput -notmatch 'ok engine 0.2.1-alpha.1 started') { throw 'installed Windows Engine did not start' }
          if ($doctorOutput -notmatch 'ok protocol 2 compatible') { throw 'installed Windows Engine protocol check failed' }
          $fishyume = Join-Path $installRoot 'node_modules/.bin/fishyume.cmd'
          $helpOutput = & $fishyume --help | Out-String
          if ($helpOutput -notmatch 'dashboard') { throw 'installed CLI does not expose Dashboard' }
          $dashboardHelp = & $fishyume dashboard --help | Out-String
          if ($dashboardHelp -notmatch 'Operator Dashboard') { throw 'installed Dashboard help is incomplete' }
          $setupOutput = (& $fishyume setup --print | Out-String).Trim()
          if ($setupOutput -notmatch '^codex mcp add fishyume -- ".+node(?:\.exe)?" ".+[\\/]fishyume[\\/]dist[\\/]cli\.js" "mcp"$') { throw 'installed Codex setup command is not canonical and copyable' }
          $demoOutput = & $fishyume demo --width 80 --ascii | Out-String
          if ($demoOutput -notmatch '阶段 2 · 并行 2' -or $demoOutput -notmatch '依赖 plan' -or $demoOutput -notmatch '需要人工审批') { throw 'installed offline topology demo is incomplete' }
          $dashboardOutput = & $fishyume | Out-String
          if ($dashboardOutput -notmatch '目前没有可显示的任务。' -or $dashboardOutput -notmatch '检查运行环境：fishyume doctor') { throw 'installed zero-argument Dashboard empty state is incomplete' }

# Public CI uses fake Driver/compatibility fixtures and never requires Provider login.
# M4.4 live Host/Driver/TUI/crash acceptance remains a separate manual gate.
