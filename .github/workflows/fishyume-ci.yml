name: Fishyume CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            wf/package-lock.json
            fishyume-web/package-lock.json
      - name: Go tests
        working-directory: wf-engine
        shell: pwsh
        run: go test -p 1 ./... -count=1 -timeout 10m
      - name: Go vet
        run: node wf/scripts/preflight.mjs --step go-vet
      - name: Go build
        run: node wf/scripts/preflight.mjs --step go-build
      - name: M6 routing release gate
        working-directory: wf-engine
        shell: pwsh
        run: go test ./internal/routing ./internal/run ./internal/application -run 'M6|Routing|Fallback|RoutingUsage|Preflight' -count=1 -timeout 10m
      - name: Node dependencies
        run: npm --prefix wf ci
      - name: TypeScript typecheck
        run: npm --prefix wf run typecheck
      - name: TypeScript tests
        shell: bash
        run: |
          set -euo pipefail
          if ! npm --prefix wf test; then
            echo 'Initial TypeScript test run failed; retrying once with a fresh process state.' >&2
            npm --prefix wf test
          fi
      - name: TypeScript build
        run: npm --prefix wf run build
      - name: Fishyume package audits
        run: |
          npm --prefix wf run pack:audit
          npm --prefix wf run pack:audit:real
      - name: Optional Web client checks
        run: |
          npm --prefix fishyume-web ci --ignore-scripts
          npm --prefix fishyume-web run verify
          npm --prefix fishyume-web run smoke:install
      - name: M6 operator surface release gate
        run: npm --prefix wf test -- --test-name-pattern='M6.6|M6.7|routing|MCP and Machine CLI expose identical'
      - name: Diff check
        run: node wf/scripts/preflight.mjs --step diff-check
      - name: Reliability script tests
        run: node --test wf/scripts/reliability-scripts.test.mjs

  stress:
    name: Deterministic high-risk stress gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - name: Stress internal lifecycle packages (20 repetitions)
        run: node wf/scripts/stress.mjs

  artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - name: Build Windows Engine artifacts
        shell: pwsh
        run: ./wf/scripts/build-engine-artifacts.ps1 -Target windows-amd64
      - name: Verify checksums
        shell: pwsh
        run: |
          ./wf/scripts/verify-engine-artifacts.ps1
          Get-ChildItem ./wf/artifacts -Recurse -Filter SHA256SUMS | ForEach-Object {
            if (-not (Get-Content -Raw $_.FullName).Trim()) { throw "empty checksum file: $($_.FullName)" }
          }

  windows-platform-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: wf-engine/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: wf/package-lock.json
      - name: Install and verify Windows Developer Preview
        shell: pwsh
        run: |
          $installRoot = "$env:RUNNER_TEMP/fishyume-install"
          ./install-fishyume.ps1 -Prefix $installRoot
          $engine = Join-Path $installRoot 'node_modules/fishyume-engine-win32-x64/bin/fishyume-engine.exe'
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) { throw "missing Windows Engine: $engine" }
          $doctorOutput = & (Join-Path $installRoot 'node_modules/.bin/fishyume.cmd') doctor 2>&1 | Out-String
          $global:LASTEXITCODE = 0
          if ($doctorOutput -notmatch 'ok engine 0.2.1-alpha.1 started') { throw 'installed Windows Engine did not start' }
          if ($doctorOutput -notmatch 'ok protocol 2 compatible') { throw 'installed Windows Engine protocol check failed' }
          $fishyume = Join-Path $installRoot 'node_modules/.bin/fishyume.cmd'
          if ((& $fishyume --help | Out-String) -notmatch 'dashboard') { throw 'installed CLI does not expose Dashboard' }
          if ((& $fishyume dashboard --help | Out-String) -notmatch 'Operator Dashboard') { throw 'installed Dashboard help is incomplete' }
          $setupOutput = (& $fishyume setup --print | Out-String).Trim()
          if ($setupOutput -notmatch 'codex mcp add fishyume') { throw 'installed Codex setup command is not canonical' }
          $routingJson = ((& $fishyume machine routing.catalog --params '{}') | Out-String) | ConvertFrom-Json
          if ($routingJson.apiVersion -ne 'fishyume.application/v1' -or $routingJson.dynamicAvailability -isnot [bool]) { throw 'installed routing catalog Application surface is incomplete' }
          $demoOutput = & $fishyume demo --width 80 --ascii | Out-String
          if ($demoOutput -notmatch 'FISHYUME' -or $demoOutput -notmatch 'topology') { throw 'installed offline topology demo is incomplete' }
          $dashboardOutput = & $fishyume | Out-String
          if ($dashboardOutput -notmatch 'fishyume doctor') { throw 'installed zero-argument Dashboard empty state is incomplete' }

# Public CI is Windows-only because the current Developer Preview publishes only
# the Windows x64 Engine package. Linux support can return with a concrete release target.
